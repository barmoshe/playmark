name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/*.test.mjs

  godot:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        godot: ["4.5.1", "4.7.2"]
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot ${{ matrix.godot }}
        run: |
          curl -sSLo godot.zip "https://github.com/godotengine/godot/releases/download/${{ matrix.godot }}-stable/Godot_v${{ matrix.godot }}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv Godot_v*_linux.x86_64 godot && chmod +x godot
      - name: Import (parse every script)
        run: |
          ./godot --headless --path demo --import 2>&1 | tee import.log
          ! grep -E "SCRIPT ERROR|Parse Error" import.log
      - name: Unit tests
        run: ./godot --headless --path demo --script "$PWD/tests/unit.gd"
